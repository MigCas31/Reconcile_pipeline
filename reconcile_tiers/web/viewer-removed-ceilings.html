<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Removed Ceiling Fragments</title>
  <link rel="stylesheet" href="./viewer-tiers.css">
  <link rel="stylesheet" href="./viewer-removed-ceilings.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside>
    <header>
      <h1>Removed ceiling fragments</h1>
      <input id="search" placeholder="Address, UUID, reason, or locator" autocomplete="off">
      <div class="filter-row">
        <select id="sort-mode" title="Sort order">
          <option value="count-desc">Sort: count ↓</option>
          <option value="area-desc">Sort: area ↓</option>
          <option value="uuid-asc">Sort: UUID ↑</option>
        </select>
      </div>
    </header>
    <div id="sidebar-stats">Loading...</div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="top-bar">
      <button class="nav-btn" id="nav-prev" title="Previous building">↑</button>
      <button class="nav-btn" id="nav-next" title="Next building">↓</button>
      <div id="current">
        <div id="current-address">Loading removal corpus...</div>
        <div id="current-meta"></div>
      </div>
      <div id="pill">-</div>
    </div>
    <div id="view-controls">
      <div class="control-row">
        <label for="explode-slider">Explode storeys</label>
        <input id="explode-slider" type="range" min="0" max="5" step="0.1" value="0" />
        <span id="explode-readout">0.0 m</span>
      </div>
      <div class="control-row">
        <label for="story-select">Show storey</label>
        <select id="story-select"><option value="all">All</option></select>
      </div>
      <div class="control-row">
        <label class="check-row"><input id="base-toggle" type="checkbox" checked /> Show building</label>
      </div>
      <div class="control-row">
        <label class="check-row"><input id="removed-toggle" type="checkbox" checked /> Show removed</label>
      </div>
      <div class="control-row">
        <label class="check-row"><input id="replacement-toggle" type="checkbox" checked /> Show coverage</label>
      </div>
      <div id="overlay-legend">
        <span><i class="legend-chip removed"></i>removed</span>
        <span><i class="legend-chip replacement"></i>same-plane</span>
        <span><i class="legend-chip extension"></i>neighbour extension</span>
        <span><i class="legend-chip noncoplanar"></i>not coplanar</span>
      </div>
    </div>
    <canvas id="view"></canvas>
    <section id="fragment-panel">
      <header>
        <span id="fragment-panel-title">Removed pieces</span>
        <span id="fragment-panel-count">0</span>
      </header>
      <ol id="fragment-list"></ol>
    </section>
    <div id="loading" class="hidden">Loading...</div>
    <div id="status">Loading...</div>
  </main>
  <script type="module" src="./viewer-removed-ceilings-main.js"></script>
</body>
</html>
