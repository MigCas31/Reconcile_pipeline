<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roof Proposal Labeler</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; color:#ddd; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; display:flex; }

#sidebar {
  width:280px; min-width:280px; height:100vh; background:#0d0d1a;
  border-right:1px solid #222; display:flex; flex-direction:column; z-index:20;
}
#sidebar-header { padding:12px; border-bottom:1px solid #222; }
#sidebar-header h1 { font-size:15px; font-weight:600; margin-bottom:8px; }
#search { width:100%; padding:6px 10px; border-radius:6px; border:1px solid #333; background:#1a1a2e; color:#ddd; font-size:12px; outline:none; }
#search:focus { border-color:#3a3aff; }
#search::placeholder { color:#555; }
#sidebar-stats { padding:6px 12px; font-size:10px; color:#555; border-bottom:1px solid #1a1a2a; }
#building-list { flex:1; overflow-y:auto; }
#building-list::-webkit-scrollbar { width:6px; }
#building-list::-webkit-scrollbar-track { background:#0d0d1a; }
#building-list::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }

.bldg-item {
  padding:8px 12px; cursor:pointer; border-bottom:1px solid #1a1a2a;
  transition:background .12s;
}
.bldg-item:hover { background:#1a1a2e; }
.bldg-item.active { background:#1a1a3e; border-left:3px solid #3a3aff; }
.bldg-addr { font-size:12px; font-weight:500; line-height:1.3; color:#ccc; }
.bldg-meta { font-size:10px; color:#666; margin-top:2px; display:flex; gap:6px; }
.bldg-meta .tag { padding:1px 5px; border-radius:3px; font-size:9px; font-weight:600; }
.tag-GREEN { background:#1a3a1a; color:#4c4; }
.tag-YELLOW { background:#3a3a1a; color:#cc4; }
.tag-RED { background:#3a1a1a; color:#c44; }
.tag-UNKNOWN { background:#2a2a2a; color:#888; }
.stories-badge { color:#888; }
.stories-badge.multi { color:#4ecdc4; }

#viewport { flex:1; position:relative; }

#controls-bar {
  position:absolute; top:0; left:0; right:0; z-index:10;
  padding:10px 14px; display:flex; align-items:center; gap:16px;
  background:linear-gradient(to bottom, rgba(0,0,0,.7) 0%, transparent 100%);
  pointer-events:none;
}
#controls-bar > * { pointer-events:auto; }
.toggle-row { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:11px; max-width:600px; }
.toggle-row label { cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap; }
.toggle-row input { accent-color:#3a3aff; }

/* Keep DOM elements present so viewer-main.js doesn't crash, but hide the
 * clutter this focused page doesn't need. */
.hidden-ctrl { display:none !important; }

#legend-box { font-size:10px; line-height:1.8; }
#legend-box span { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:3px; }

#building-info {
  position:absolute; bottom:10px; left:10px; right:10px;
  font-size:11px; color:#666; z-index:10;
}

canvas { display:block; width:100%; height:100%; }

#proposal-panel {
  display:none; position:absolute; top:60px; left:10px; z-index:16;
  background:rgba(13,13,26,0.92); border:1px solid #333; border-radius:8px;
  padding:10px; font-size:11px; width:320px; max-height:70vh; overflow-y:auto;
}
#proposal-panel.visible { display:block; }
#proposal-panel h3 { font-size:12px; margin-bottom:6px; color:#cde; }
#proposal-panel .kv { display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin-bottom:8px; }
#proposal-panel .kv .k { color:#888; }
#proposal-panel .kv .v { color:#ddd; text-align:right; font-variant-numeric:tabular-nums; }
#proposal-panel .heuristic-row { margin-bottom:8px; padding:4px 6px; background:#1a1a2a; border-radius:4px; }
#proposal-panel .action-row { display:flex; gap:6px; margin-bottom:8px; }
#proposal-panel button.action {
  flex:1; padding:6px 8px; border:1px solid #444; border-radius:4px; cursor:pointer;
  color:#fff; font-weight:600; font-size:11px;
}
#proposal-panel button.accept { background:#166534; }
#proposal-panel button.accept:hover { background:#22c55e; }
#proposal-panel button.reject { background:#7f1d1d; }
#proposal-panel button.reject:hover { background:#ef4444; }
#proposal-panel button.skip { background:#334155; }
#proposal-panel button.skip:hover { background:#64748b; }
#proposal-panel button.split { background:#4c1d95; }
#proposal-panel button.split:hover { background:#7c3aed; }
#proposal-panel button.split.active { background:#7c3aed; border-color:#c4b5fd; }
#proposal-panel .reasons { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
#proposal-panel .reason-chip {
  font-size:10px; padding:2px 6px; border-radius:10px; background:#2a2a2a;
  color:#aaa; cursor:pointer; border:1px solid #333;
}
#proposal-panel .reason-chip.on { background:#3a1a1a; color:#f88; border-color:#744; }
#proposal-panel .status-line { color:#888; font-size:10px; min-height:14px; }

#queue-bar {
  display:none; position:absolute; top:60px; right:10px; z-index:16;
  background:rgba(13,13,26,0.92); border:1px solid #333; border-radius:8px;
  padding:6px 8px; font-size:11px; align-items:center; gap:6px;
}
#queue-bar.visible { display:flex; }
#queue-bar button {
  padding:3px 8px; border:1px solid #444; border-radius:4px; cursor:pointer;
  color:#ddd; background:#1a1a2e; font-size:11px;
}
#queue-bar button:hover { background:#2a2a3e; }
#queue-bar button.primary { background:#166534; color:#fff; border-color:#22c55e; }
#queue-bar button.primary:hover { background:#22c55e; }
#queue-bar .counter { color:#aaa; font-variant-numeric:tabular-nums; }
#queue-bar .counter strong { color:#fff; }

#labeler-help {
  position:absolute; bottom:10px; right:10px; z-index:10;
  font-size:10px; color:#666; background:rgba(13,13,26,0.9);
  padding:6px 10px; border:1px solid #222; border-radius:6px;
}
#labeler-help kbd {
  font-family:inherit; background:#1a1a2e; color:#ccc;
  padding:1px 5px; border-radius:3px; border:1px solid #333;
}
</style>
</head>
<body data-mode="labeling">

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Roof Proposal Labeler</h1>
    <input type="text" id="search" placeholder="Search address or UUID...">
  </div>
  <div id="sidebar-stats"></div>
  <div id="building-list"></div>
</div>

<div id="viewport">
  <div id="controls-bar">
    <div class="toggle-row">
      <label><input type="checkbox" id="show-full-model" checked> Full model</label>
      <label><input type="checkbox" id="show-v3-roof-proposals" checked> V3 roof proposals</label>
      <label title="Lifts segments on near-duplicate planes to a shared averaged plane. Each segment is still individually clickable and labelable."><input type="checkbox" id="merge-v3-roof-proposal-planes" checked> Merge similar planes</label>
      <label><input type="checkbox" id="show-floors" checked> Floors</label>
      <label><input type="checkbox" id="show-merged" checked> Merged walls</label>
      <label><input type="checkbox" id="show-computed" checked> Computed walls</label>
      <label><input type="checkbox" id="show-gaps" checked> Gaps</label>
      <label><input type="checkbox" id="show-cross-story" checked> Cross-story gaps</label>
      <label><input type="checkbox" id="show-v3-model"> V3 model</label>
      <label><input type="checkbox" id="show-ortho"> Ortho map</label>

      <!-- Required by viewer-main.js but hidden on this focused page. -->
      <label class="hidden-ctrl"><input type="checkbox" id="show-doors" checked></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-windows" checked></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-wireframe"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="color-by-story" checked></label>
      <label class="hidden-ctrl"><input type="checkbox" id="color-by-source"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-extensions" checked></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-ceilings"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-thermal-ceilings"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-roof-clusters"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-ontology-semantics"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-ontology-continuation"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-ontology-cells"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-overlaps"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-wall-clips"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-ext-gaps"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-full-model-diff"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-v3-gable-extension"></label>
      <label class="hidden-ctrl"><input type="checkbox" id="show-model-map"></label>
    </div>
    <div id="legend-box"></div>
  </div>

  <!-- Pipeline and map panels are hidden on this focused page but kept so
       viewer-main.js wiring doesn't 404 on getElementById. -->
  <div id="pipeline-bar" class="hidden-ctrl">
    <button id="pipeline-prev"></button>
    <span id="pipeline-current"></span>
    <button id="pipeline-next"></button>
    <div id="pipeline-steps"></div>
  </div>
  <div id="map-panel" class="hidden-ctrl">
    <div id="map-panel-status"></div>
    <input type="range" id="map-rot" min="-10" max="10" step="0.1" value="0"><span id="map-rot-val">0</span>
    <input type="range" id="map-east" min="-20" max="20" step="0.1" value="0"><span id="map-east-val">0</span>
    <input type="range" id="map-north" min="-20" max="20" step="0.1" value="0"><span id="map-north-val">0</span>
    <button id="map-align-reset"></button>
    <button id="map-auto-align"></button>
    <button id="map-anchor-mode"></button>
  </div>

  <div id="building-info"></div>
  <div id="queue-bar" class="visible">
    <span class="counter" id="queue-counter">—</span>
    <button id="queue-prev" title="Previous proposal (J / ←)">&larr;</button>
    <button id="queue-next" title="Next proposal (K / →)">&rarr;</button>
    <button id="queue-next-unlabeled" class="primary" title="Keyboard: N">Next unlabeled (N)</button>
  </div>
  <div id="proposal-panel">
    <h3>V3 Roof Proposal</h3>
    <div class="kv" id="proposal-kv"></div>
    <div class="heuristic-row" id="proposal-heuristic"></div>
    <div class="reasons" id="proposal-reasons"></div>
    <div class="action-row">
      <button class="action accept" data-label="accepted" title="Keyboard: A">Accept (A)</button>
      <button class="action reject" data-label="rejected" title="Keyboard: R">Reject (R)</button>
      <button class="action skip" data-label="skipped" title="Keyboard: S">Skip (S)</button>
    </div>
    <div class="action-row">
      <button class="action split" id="proposal-split" title="Keyboard: X">Split (X)</button>
    </div>
    <div class="status-line" id="proposal-status"></div>
    <div class="status-line" style="color:#555;">Keys: A accept, R reject, S skip, X split, N next unlabeled, ↓/↑ next/prev building, Esc cancel</div>
  </div>
  <div id="labeler-help">
    <kbd>N</kbd> next unlabeled &nbsp;
    <kbd>A</kbd>/<kbd>R</kbd>/<kbd>S</kbd> accept/reject/skip &nbsp;
    <kbd>X</kbd> split &nbsp;
    <kbd>J</kbd>/<kbd>K</kbd> prev/next &nbsp;
    <kbd>↓</kbd>/<kbd>↑</kbd> next/prev building &nbsp;
    <kbd>Shift</kbd>+click multi-select
  </div>
  <canvas id="c"></canvas>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module" src="viewer-main.js?v=20260418splitfix"></script>
<script>
// Auto-enable the V3 roof proposals layer and jump straight to the first
// unlabeled proposal — this page is meant to land directly on a
// ready-to-label case, no sidebar clicking or toggle flipping required.
// Once viewer-main.js has wired change handlers and the building list has
// populated, dispatching `change` kicks setLayerVisibility →
// maybeLoadV3ForCurrentBuilding → render. Then a synthetic click on
// "Next unlabeled" steps the global queue to the first case and loads its
// building for us. After that, A/R/S with autoAdvance carries us through.
(function autoBootstrap() {
  const list = document.getElementById('building-list');
  const toggle = document.getElementById('show-v3-roof-proposals');
  const jumpBtn = document.getElementById('queue-next-unlabeled');
  if (!list || !toggle || !jumpBtn) return;
  let fired = false;
  function fire() {
    if (fired) return;
    fired = true;
    toggle.checked = true;
    toggle.dispatchEvent(new Event('change'));
    // Give maybeLoadV3ForCurrentBuilding one frame to enqueue its fetch,
    // then ask stepQueue to find the first unlabeled candidate.
    setTimeout(() => jumpBtn.click(), 250);
  }
  const obs = new MutationObserver(() => {
    if (list.querySelector('.bldg-item')) {
      obs.disconnect();
      setTimeout(fire, 50);
    }
  });
  obs.observe(list, { childList: true });
  setTimeout(fire, 5000);
})();
</script>
</body>
</html>
