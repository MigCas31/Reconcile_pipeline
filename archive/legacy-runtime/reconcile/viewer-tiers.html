<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buildings by complexity · Tier viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#fafafa; color:#1a1a1a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; height:100vh; overflow:hidden; }
body { display:flex; width:100vw; }
a { color:inherit; text-decoration:none; }

#sidebar {
  width:320px; min-width:320px; height:100vh; background:#ffffff;
  border-right:1px solid #d6d6da; display:flex; flex-direction:column;
}
#sidebar-header { padding:14px 14px 10px 14px; border-bottom:1px solid #e4e4e8; }
#sidebar-header h1 { font-size:15px; font-weight:600; letter-spacing:-0.01em; margin-bottom:8px; }
#sidebar-header #search {
  width:100%; padding:6px 10px; border:1px solid #cfcfd4; border-radius:6px;
  background:#fafafa; font-size:12px; outline:none;
}
#sidebar-header #search:focus { border-color:#3a3aff; }
#sidebar-stats { padding:4px 14px 8px 14px; font-size:10px; color:#999; border-bottom:1px solid #e4e4e8; font-variant-numeric:tabular-nums; }
#building-list { flex:1; overflow-y:auto; }
#building-list::-webkit-scrollbar { width:6px; }
#building-list::-webkit-scrollbar-track { background:#ffffff; }
#building-list::-webkit-scrollbar-thumb { background:#cfcfd4; border-radius:3px; }

.tier-group { border-bottom:1px solid #eee; }
.tier-header {
  padding:8px 12px; background:#fafafa; border-bottom:1px solid #e4e4e8;
  cursor:pointer; display:flex; align-items:center; gap:8px; user-select:none;
  font-size:11px; font-weight:600; color:#333; text-transform:uppercase; letter-spacing:0.03em;
}
.tier-header:hover { background:#f0f0f2; }
.tier-header .arrow { font-size:9px; color:#999; transition:transform .12s; }
.tier-group.collapsed .arrow { transform:rotate(-90deg); }
.tier-num { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; background:#1a1a1a; color:white; font-size:10px; }
.tier-count { margin-left:auto; color:#888; font-weight:400; text-transform:none; font-size:10px; }
.tier-group.collapsed .tier-list { display:none; }

.bldg-item {
  padding:7px 12px 7px 20px; cursor:pointer; border-bottom:1px solid #f5f5f7;
  transition:background .1s;
}
.bldg-item:hover { background:#f5f5f7; }
.bldg-item.active { background:#e6edff; border-left:3px solid #3a3aff; padding-left:17px; }
.bldg-addr { font-size:12px; font-weight:500; color:#1a1a1a; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bldg-meta { font-size:10px; color:#888; margin-top:2px; display:flex; flex-wrap:wrap; gap:4px; }
.pill {
  font-size:9px; padding:1px 5px; border-radius:3px;
  background:#eef2f7; color:#555; font-weight:500;
}
.pill-gable { background:#fef3c7; color:#92400e; }
.pill-half { background:#ede9fe; color:#5b21b6; }
.pill-oblique { background:#e0e7ff; color:#3730a3; }
.bldg-item.hidden, .tier-group.hidden { display:none; }

#viewport { flex:1; position:relative; min-width:0; }
#top-bar {
  position:absolute; top:0; left:0; right:0; z-index:5;
  padding:10px 14px; display:flex; align-items:center; gap:12px; pointer-events:none;
  background:linear-gradient(to bottom, rgba(240,240,242,0.95) 0%, transparent 100%);
}
#top-bar > * { pointer-events:auto; }
#top-bar .title { font-size:13px; font-weight:600; color:#1a1a1a; }
#top-bar .subtitle { font-size:11px; color:#666; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace; }
#top-bar .nav-btn {
  width:28px; height:28px; border:1px solid #d6d6da; background:white; border-radius:6px;
  cursor:pointer; font-size:13px; color:#333;
}
#top-bar .nav-btn:hover { background:#f5f5f7; }
#top-bar .nav-btn:disabled { opacity:.4; cursor:not-allowed; }
#open-viewer {
  margin-left:auto; padding:6px 10px; font-size:11px; font-weight:500;
  border:1px solid #d6d6da; background:white; border-radius:6px; cursor:pointer; color:#333;
}
#open-viewer:hover { background:#f5f5f7; }

#canvas-container { position:absolute; inset:0; }
canvas#three-canvas { display:block; width:100%; height:100%; }

#status {
  position:absolute; bottom:12px; left:14px; right:14px; z-index:5;
  font-size:11px; color:#666; pointer-events:none;
}
#loading {
  position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
  font-size:12px; color:#999; z-index:4;
}
#loading.hidden { display:none; }

#signals {
  position:absolute; top:58px; left:14px; z-index:5;
  background:rgba(255,255,255,0.92); border:1px solid #d6d6da; border-radius:8px;
  padding:8px 10px; font-size:11px; color:#333; min-width:160px;
}
#signals .row { display:flex; justify-content:space-between; gap:10px; margin:1px 0; }
#signals .row .k { color:#888; }
#signals .row .v { font-variant-numeric:tabular-nums; font-weight:500; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Buildings by complexity</h1>
    <input type="text" id="search" placeholder="Search address or UUID…">
  </div>
  <div id="sidebar-stats">loading…</div>
  <div id="building-list"></div>
</div>

<div id="viewport">
  <div id="top-bar">
    <button class="nav-btn" id="nav-prev" title="Previous (↑)">↑</button>
    <button class="nav-btn" id="nav-next" title="Next (↓)">↓</button>
    <div>
      <div class="title" id="current-addr">—</div>
      <div class="subtitle" id="current-uuid"></div>
    </div>
    <button id="open-viewer" title="Open in the full viewer">Open in viewer.html →</button>
  </div>
  <div id="signals"></div>
  <div id="canvas-container"><canvas id="three-canvas"></canvas></div>
  <div id="loading" class="hidden">loading…</div>
  <div id="status">Arrow keys (↑/↓) to navigate.</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import {
  populateBuildingScene,
  addPascalLighting,
  clearBuildingMeshes,
} from './viewer-modules/tier-preview.js';

// --- DOM handles -------------------------------------------------------

const sidebarStats = document.getElementById('sidebar-stats');
const buildingList = document.getElementById('building-list');
const searchEl = document.getElementById('search');
const currentAddrEl = document.getElementById('current-addr');
const currentUuidEl = document.getElementById('current-uuid');
const loadingEl = document.getElementById('loading');
const signalsEl = document.getElementById('signals');
const navPrev = document.getElementById('nav-prev');
const navNext = document.getElementById('nav-next');
const openViewerBtn = document.getElementById('open-viewer');
const canvas = document.getElementById('three-canvas');

// --- Three.js setup ----------------------------------------------------

// Scene + renderer setup copied from the Pascal editor viewer
// (.context/pascal-editor/packages/viewer/src/components/viewer/index.tsx):
// pure-white background, ACES Filmic tone mapping @ 0.9 exposure, fov 50,
// PCFShadowMap (not Soft). WebGPU + SSGI post-processing are skipped since
// this page targets WebGL.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
addPascalLighting(scene);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
camera.position.set(15, 12, 15);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// Image-based lighting (approximates Pascal's SSGI bounced-light contribution
// in WebGL). PMREMGenerator turns the procedural `RoomEnvironment` into a
// prefiltered mipmap the shader samples for diffuse + specular indirect
// lighting — walls pick up subtle reflections from floors/ceilings, so
// creases aren't pitch black and flat panels carry a soft directional
// shade. Much closer to the "bounced light" feel of a real GI pipeline.
const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 2, 0);

// Post-processing — approximates Pascal's WebGPU SSGI + denoise pipeline
// (.context/pascal-editor/packages/viewer/src/components/viewer/post-
// processing.tsx). Under plain WebGL:
//   1. RenderPass  — lit scene (with IBL from RoomEnvironment above).
//   2. GTAOPass    — ground-truth ambient occlusion. Cleaner than SSAOPass,
//                    with a built-in depth-aware filter that acts as a
//                    denoiser. Darkens creases around wall corners, door
//                    reveals, and under eaves so walls read as architecture
//                    rather than flat boxes.
//   3. SMAAPass    — subpixel morphological anti-aliasing. Smoother than
//                    FXAA on long thin wall edges, and Pascal's WebGPU
//                    output is closer in feel to SMAA.
// OutputPass applies tone mapping + color-space conversion at the end.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.output = GTAOPass.OUTPUT.Default;
// Radius 0.4 + distanceExponent 1.2 (down from 0.6 / 1.5): GTAO should pick
// out real corners (wall-floor joins, door reveals) without flooding the
// thin seams between interior gap geometry and adjacent walls with shadow.
gtao.updateGtaoMaterial({
  radius: 0.4,
  distanceExponent: 1.2,
  thickness: 0.5,
  scale: 1.0,
  samples: 16,
  distanceFallOff: 1.0,
  screenSpaceRadius: false,
});
composer.addPass(gtao);

const smaa = new SMAAPass(1, 1);
composer.addPass(smaa);

composer.addPass(new OutputPass());

function resize() {
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = canvas.clientHeight || canvas.parentElement.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = Math.max(1, w) / Math.max(1, h);
  camera.updateProjectionMatrix();
  gtao.setSize(w, h);
  smaa.setSize(w, h);
}
window.addEventListener('resize', resize);
resize();

function tick() {
  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();

// --- Data fetching -----------------------------------------------------

async function fetchBuildingMerged(uuid) {
  const res = await fetch(`/building-merged?uuid=${encodeURIComponent(uuid)}`);
  if (!res.ok) return null;
  return res.json();
}

// --- Sidebar rendering -------------------------------------------------

const state = {
  flat: [], // flat ordered list of {uuid, address, tier, ...signals}
  byUuid: new Map(),
  activeUuid: null,
};

function buildSidebar(tiers) {
  buildingList.innerHTML = '';
  state.flat = [];
  state.byUuid.clear();

  for (const t of tiers) {
    const group = document.createElement('div');
    group.className = 'tier-group';
    group.dataset.tier = t.tier;

    const header = document.createElement('div');
    header.className = 'tier-header';
    header.innerHTML = `
      <span class="arrow">▼</span>
      <span class="tier-num">${t.tier}</span>
      <span>${escapeHtml(t.label)}</span>
      <span class="tier-count">${t.count}</span>
    `;
    header.addEventListener('click', () => group.classList.toggle('collapsed'));
    group.appendChild(header);

    const list = document.createElement('div');
    list.className = 'tier-list';
    for (const b of t.buildings) {
      const item = document.createElement('div');
      item.className = 'bldg-item';
      item.dataset.uuid = b.uuid;
      item.dataset.address = (b.address || '').toLowerCase();
      item.innerHTML = `
        <div class="bldg-addr">${escapeHtml(b.address || '(no address)')}</div>
        <div class="bldg-meta">
          <span class="pill">${b.n_stories}st</span>
          ${b.has_half_height ? '<span class="pill pill-half">½</span>' : ''}
          ${b.has_gable ? '<span class="pill pill-gable">gable</span>' : ''}
          ${b.n_oblique > 0 ? `<span class="pill pill-oblique">${b.n_oblique}ob</span>` : ''}
          ${b.n_flat > 0 ? `<span class="pill">${b.n_flat}fl</span>` : ''}
        </div>
      `;
      item.addEventListener('click', () => selectBuilding(b.uuid));
      list.appendChild(item);

      const enriched = { ...b, tier: t.tier, tierLabel: t.label };
      state.flat.push(enriched);
      state.byUuid.set(b.uuid, { data: enriched, element: item });
    }
    group.appendChild(list);
    buildingList.appendChild(group);

    if (t.count === 0) group.classList.add('hidden');
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// --- Selection + rendering ---------------------------------------------

async function selectBuilding(uuid) {
  const entry = state.byUuid.get(uuid);
  if (!entry) return;
  state.activeUuid = uuid;

  // Sidebar: mark active, scroll into view, expand its tier group.
  for (const el of buildingList.querySelectorAll('.bldg-item.active')) {
    el.classList.remove('active');
  }
  entry.element.classList.add('active');
  const group = entry.element.closest('.tier-group');
  if (group) group.classList.remove('collapsed');
  entry.element.scrollIntoView({ behavior: 'auto', block: 'nearest' });

  // Top bar / signals.
  const b = entry.data;
  currentAddrEl.textContent = b.address || '(no address)';
  currentUuidEl.textContent = `${b.uuid} · Tier ${b.tier} · ${b.tierLabel}`;
  signalsEl.innerHTML = `
    <div class="row"><span class="k">Storeys</span><span class="v">${b.n_stories}</span></div>
    <div class="row"><span class="k">Rooms</span><span class="v">${b.n_rooms}</span></div>
    <div class="row"><span class="k">Oblique</span><span class="v">${b.n_oblique}</span></div>
    <div class="row"><span class="k">Flat</span><span class="v">${b.n_flat}</span></div>
    <div class="row"><span class="k">Half-height</span><span class="v">${b.has_half_height ? 'yes' : 'no'}</span></div>
    <div class="row"><span class="k">Gable</span><span class="v">${b.has_gable ? 'yes' : 'no'}</span></div>
  `;

  // URL hash — so reloads / share-links restore the selection.
  history.replaceState(null, '', `#b=${uuid}`);

  // 3D: clear previous, fetch, populate, frame.
  loadingEl.classList.remove('hidden');
  clearBuildingMeshes(scene);
  try {
    const merged = await fetchBuildingMerged(uuid);
    // Guard against stale responses if the user clicked another building.
    if (state.activeUuid !== uuid) return;
    const { center, radius } = populateBuildingScene(scene, { merged });
    frameCamera(center, radius);
  } catch (err) {
    console.warn('failed to render', uuid, err);
  } finally {
    if (state.activeUuid === uuid) loadingEl.classList.add('hidden');
  }
}

function frameCamera(center, radius) {
  controls.target.copy(center);
  // Fixed isometric-ish angle, distance scaled to fit the AABB.
  const yaw = Math.PI / 5.2;
  const pitch = Math.PI / 5.5;
  const dist = radius / Math.tan((camera.fov / 2) * Math.PI / 180) + radius * 0.6;
  camera.position.set(
    center.x + dist * Math.cos(pitch) * Math.sin(yaw),
    center.y + dist * Math.sin(pitch),
    center.z + dist * Math.cos(pitch) * Math.cos(yaw),
  );
  camera.near = Math.max(0.1, dist * 0.01);
  camera.far = Math.max(500, dist * 10);
  camera.updateProjectionMatrix();
  controls.update();
}

// --- Navigation --------------------------------------------------------

function visibleBuildingUuids() {
  const out = [];
  for (const b of state.flat) {
    const entry = state.byUuid.get(b.uuid);
    if (entry && !entry.element.classList.contains('hidden')) out.push(b.uuid);
  }
  return out;
}

function step(delta) {
  const order = visibleBuildingUuids();
  if (order.length === 0) return;
  const idx = Math.max(0, order.indexOf(state.activeUuid));
  const nextIdx = (idx + delta + order.length) % order.length;
  selectBuilding(order[nextIdx]);
}
navPrev.addEventListener('click', () => step(-1));
navNext.addEventListener('click', () => step(1));
window.addEventListener('keydown', (e) => {
  if (e.target === searchEl) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); step(-1); }
});

openViewerBtn.addEventListener('click', () => {
  if (!state.activeUuid) return;
  window.open(`viewer.html#b=${state.activeUuid}`, '_blank');
});

// --- Search ------------------------------------------------------------

searchEl.addEventListener('input', () => {
  const term = searchEl.value.trim().toLowerCase();
  for (const group of buildingList.querySelectorAll('.tier-group')) {
    let anyVisible = false;
    for (const item of group.querySelectorAll('.bldg-item')) {
      const hit = !term
        || item.dataset.address.includes(term)
        || item.dataset.uuid.toLowerCase().includes(term);
      item.classList.toggle('hidden', !hit);
      if (hit) anyVisible = true;
    }
    group.classList.toggle('hidden', !anyVisible);
  }
});

// --- Bootstrap ---------------------------------------------------------

async function init() {
  const res = await fetch('/tier-index');
  if (!res.ok) {
    sidebarStats.textContent = `Failed to load /tier-index (${res.status})`;
    return;
  }
  const data = await res.json();
  const tiers = data.tiers || [];
  const total = tiers.reduce((sum, t) => sum + t.count, 0);
  sidebarStats.textContent = `${total} buildings · 8 tiers`;
  buildSidebar(tiers);

  // Default selection: first building of the first non-empty tier, or from hash.
  const hashUuid = (location.hash.match(/^#b=(.+)$/) || [])[1];
  if (hashUuid && state.byUuid.has(hashUuid)) {
    selectBuilding(hashUuid);
  } else if (state.flat.length) {
    selectBuilding(state.flat[0].uuid);
  }
}

init();
</script>
</body>
</html>
